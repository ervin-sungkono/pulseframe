name: Application checks and DSP parity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  dsp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: rustup show
      - run: pnpm format:rust:check
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
            ~/.cargo/bin/wasm2es6js
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: dsp-toolchain-1.85.1-bindgen-0.2.100-${{ runner.os }}
      - run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - run: cargo test --locked --manifest-path crates/pulseframe-dsp/Cargo.toml
      - run: pnpm dsp:build
      - run: git diff --exit-code -- public/dsp
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec tsc --noEmit --incremental false
