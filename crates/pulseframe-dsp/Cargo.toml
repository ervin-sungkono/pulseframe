[package]
name = "pulseframe-dsp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.1"
description = "Scalar f64 DSP core for Pulseframe browser audio analysis"
license = "UNLICENSED"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rustfft = { version = "=6.4.1", default-features = false }
wasm-bindgen = "=0.2.100"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"

[profile.dev]
panic = "abort"
